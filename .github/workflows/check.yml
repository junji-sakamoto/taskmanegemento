# プルリクエストと main への取り込みのたびに、画面とサーバーのコードを自動で点検する。
# 手元では、frontend で npm run check と npm run build、backend で .\gradlew.bat check を実行すると同じ点検ができる。
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: 画面（Oxlint、型のチェック、ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  backend:
    name: サーバー（Checkstyle、コンパイル、テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # テスト用のデータベースは、Testcontainers が Docker で立ち上げる（ランナーに Docker が入っている）
      - run: ./gradlew check
