spring.application.name=taskmanagement

# 同じパソコンからの接続だけを受け付ける
server.address=127.0.0.1

# データベースの接続情報は、1つ上のフォルダの .env から読む
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# テーブルは Flyway で作る。JPA には作らせない
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# エラーの返事を、RFC 9457 の形（ProblemDetail）にそろえる
spring.mvc.problemdetails.enabled=true

# 記録（ログ）を、画面への表示に加えてファイルにも残す（docs/非機能要件.md 4章）
logging.file.name=logs/taskmanagement.log
