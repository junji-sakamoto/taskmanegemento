# EC2 の nginx の設定。install.sh が /etc/nginx/conf.d/taskmanagement.conf に置く。
# パソコンでの Vite と同じ役目をする。画面のファイルを配り、/api を Spring Boot へ取り次ぐ
server {
    # nginx の初期画面の代わりに、この設定を使う
    listen 80 default_server;
    listen [::]:80 default_server;

    # npm run build で作った frontend/dist を置く場所
    root /opt/taskmanagement/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 画面からの /api への通信を、Spring Boot へ取り次ぐ（vite.config.ts のプロキシと同じ）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
